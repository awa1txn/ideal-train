apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        # Replace the image with the official Ollama image if you have a preferred tag
        image: ollama/ollama:latest
        env:
        - name: PORT
          value: "11434"
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: "1"
            memory: 24Mi
          limits:
            cpu: "2"
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-svc
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 11434
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama-ingress
  namespace: ollama
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: ollama.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ollama-svc
            port:
              number: 80
